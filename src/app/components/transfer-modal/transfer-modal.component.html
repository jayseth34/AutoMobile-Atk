<h2 mat-dialog-title>{{ getTitle(data.type) }}</h2>
<form [formGroup]="transferForm">
  <!-- From Account Field -->
  <mat-form-field *ngIf="data.fromAccounts || data.type === 'cashToBank'" class="full-width">
    <mat-label>From</mat-label>
    <mat-select formControlName="fromAccount" *ngIf="data.fromAccounts">
      <mat-option *ngFor="let account of data.fromAccounts" [value]="account.name">
        {{ account.name }}
      </mat-option>
    </mat-select>
    <input matInput *ngIf="data.type === 'cashToBank'" [value]="data.fromAccount" disabled>
  </mat-form-field>

  <!-- To Account Field -->
  <mat-form-field *ngIf="data.toAccounts || data.toAccount" class="full-width">
    <mat-label>To</mat-label>
    <mat-select formControlName="toAccount" *ngIf="data.toAccounts">
      <mat-option *ngFor="let account of data.toAccounts" [value]="account.name">
        {{ account.name }}
      </mat-option>
    </mat-select>
    <input matInput *ngIf="data.toAccount" [value]="data.toAccount" disabled>
  </mat-form-field>

  <!-- Account Name Field for Adjust Balance -->
  <mat-form-field *ngIf="data.type === 'adjustBalance'" class="full-width">
    <mat-label>Account Name</mat-label>
    <mat-select formControlName="accountName">
      <mat-option *ngFor="let account of data.accountNames" [value]="account.name">
        {{ account.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Type Field for Adjust Balance -->
  <mat-form-field *ngIf="data.type === 'adjustBalance'" class="full-width">
    <mat-label>Type</mat-label>
    <mat-select formControlName="adjustmentType">
      <mat-option value="increase">Increase Balance</mat-option>
      <mat-option value="decrease">Decrease Balance</mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Amount Field -->
  <mat-form-field class="full-width">
    <mat-label>Amount</mat-label>
    <input matInput type="number" formControlName="amount" />
  </mat-form-field>

  <!-- Adjustment Date Field -->
  <mat-form-field class="full-width">
    <mat-label>Adjustment Date</mat-label>
    <input matInput [matDatepicker]="adjustmentDatePicker" formControlName="adjustmentDate" />
    <mat-datepicker-toggle matSuffix [for]="adjustmentDatePicker"></mat-datepicker-toggle>
    <mat-datepicker #adjustmentDatePicker></mat-datepicker>
  </mat-form-field>

  <!-- Description Field -->
  <!-- <mat-form-field class="full-width">
    <mat-label>Description</mat-label>
    <textarea matInput formControlName="description"></textarea>
  </mat-form-field> -->

  <div mat-dialog-actions>
    <button mat-raised-button color="warn" mat-dialog-close>Cancel</button>
    <button *ngIf = "!dataservice.hidebutton" mat-raised-button color="primary" [disabled]="!transferForm.valid" (click)="submit()">Submit</button>
  </div>
</form>
