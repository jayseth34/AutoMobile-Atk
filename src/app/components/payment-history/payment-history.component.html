<div id="myModal" class="modal" [ngClass]="{'show': showModal}">
    <div class="modal-content">
        <div class="ph-head">
            <h2 class="ph-title">Payment History</h2>
            <button type="button" class="ph-x" (click)="closeModal()" aria-label="Close">&times;</button>
        </div>
        <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Transaction Date</th>
                    <th>Ref No</th>
                    <th>Transaction Type</th>
                    <th>Linked Amount</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let payment of payments">
                    <td>{{payment.invoicedate}}</td>
                    <td>{{payment.invoicenumber}}</td>
                    <td>{{payment.typeofpay}}</td>
                    <td>{{payment.linkedamount}}</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total:</td>
                    <td>{{getTotalAmount()}}</td>
                </tr>
            </tfoot>
        </table>
        </div>
        <button type="button" class="btn close-btn close-btn-mobile" (click)="closeModal()">Close</button>
    </div>
</div>
