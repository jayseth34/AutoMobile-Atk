<div id="myModal" class="modal" [ngClass]="{'show': showModal}">
    <div class="modal-content">
        <span class="close" (click)="closeModal()">&times;</span>
        <h2>Payment History</h2>
        <table>
            <thead>
                <tr>
                    <th>Transaction Date</th>
                    <th>Ref No</th>
                    <th>Transaction Type</th>
                    <th>Linked Amount</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let payment of payments">
                    <td>{{payment.invoicedate}}</td>
                    <td>{{payment.invoicenumber}}</td>
                    <td>{{payment.typeofpay}}</td>
                    <td>{{payment.linkedamount}}</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total:</td>
                    <td>{{getTotalAmount()}}</td>
                </tr>
            </tfoot>
        </table>
        <button class="close-btn"  style="color: white; background-color: #3076f0; width: 100px;" (click)="closeModal()">CLOSE</button>
    </div>
</div>
