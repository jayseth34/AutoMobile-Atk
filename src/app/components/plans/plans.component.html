<div class="plans-container">
  <!-- Free Plan -->
  <div class="plan free" [ngClass]="{'active-plan': activePlan === 'free', 'disabled': activePlan === 'silver' || activePlan === 'gold'}">
    <!-- <div class="plan free" [ngClass]="{'active-plan': activePlan === 'free'}"> -->
    <div *ngIf="activePlan === 'free'" class="active-label">ACTIVE PLAN</div>
    <div class="plan-header">Free Trial</div>
    <div class="plan-price">₹ 0</div>
    <ul class="plan-features">
      <li>7 Days Access</li>
      <li>Desktop View</li>
    </ul>
    <button (click)="buyPlan('free')" [disabled]="activePlan === 'silver' || activePlan === 'gold'" class="btn"  style="color: white; background-color: #3076f0;">Start Free Trial</button>
  </div>

  <!-- Silver Plan -->
  <div class="plan silver" [ngClass]="{'active-plan': activePlan === 'silver'}">
    <div *ngIf="activePlan === 'silver'" class="active-label">ACTIVE PLAN</div>
    <div class="plan-header">Silver Plan</div>
    <div class="plan-price">₹ 3399 <span class="original-price">₹ 4999</span></div>
    <ul class="plan-features">
      <li>6 Months Access</li>
      <li>Desktop View</li>
    </ul>
    <button (click)="buyPlan('silver')" class="btn" style="color: white; background-color: #3076f0;">Buy Now</button>
  </div>

  <!-- Gold Plan -->
  <div class="plan gold" [ngClass]="{'active-plan': activePlan === 'gold'}">
    <div *ngIf="activePlan === 'gold'" class="active-label">ACTIVE PLAN</div>
    <div class="plan-header">Gold Plan</div>
    <div class="plan-price">₹ 3999 <span class="original-price">₹ 7799</span></div>
    <ul class="plan-features">
      <li>1 Year Access</li>
      <li>Desktop View</li>
    </ul>
    <button (click)="buyPlan('gold')" class="btn"  style="color: white; background-color: #3076f0;">Buy Now</button>
    <div class="most-popular">Most Popular</div>
  </div>
</div>
