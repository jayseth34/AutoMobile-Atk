<div>
  <!-- To include sidbar and the page -->

  <!-- Navbar -->
  <section>
    <nav class="navbar navbar-expand-lg bg-body-secondary">
      <div class="container-fluid justify-content-around">
        <form class="d-flex col-8 justify-content-around" role="search">
          <div class="col-9">
            <input
              class="form-control col-8"
              type="search"
              placeholder="/Search Transaction"
              aria-label="Search"
            />
          </div>
          <button class="col-2 btn btn-outline-primary">Search</button>
        </form>
        <ul class="navbar-nav nav-tabs col-3">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="#">Add Sale</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Add Purchase</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">More</a>
          </li>
        </ul>
      </div>
    </nav>
  </section>

  <!-- Filters -->
  <section class="m-3 bg-body-secondary">
    <form [formGroup]="filterForm">
      <div class="row p-2 mt-1 mb-2">
        <div class="select-container col-3">
          <select
            class="custom-select custom-select-md"
            id="filter"
            formControlName="range"
            (change)="handleRangeChange()"
          >
            <option *ngFor="let filter of filters; index as i" [value]="i">
              {{ filter }}
            </option>
          </select>
        </div>
        <div class="col-5 pt-1">
          <div class="input-group">
            <span class="input-group-text">Between</span>
            <input
              type="date"
              aria-label="start-date"
              class="form-control"
              formControlName="startDate"
            />
            <input
              type="date"
              aria-label="end-date"
              class="form-control"
              formControlName="endDate"
            />
          </div>
        </div>
      </div>
      <div class="row">
        <ul class="d-flex col-5 justify-content-around">
          <div class="card col-3">
            <div class="card-body">
              <h4 class="card-title">Paid</h4>
              <p class="card-text">{{ paidVal }}</p>
            </div>
          </div>
          <div class="card col-3">
            <div class="card-body">
              <h4 class="card-title">Unpaid</h4>
              <p class="card-text">{{ unpaidVal }}</p>
            </div>
          </div>
          <div class="card col-3">
            <div class="card-body">
              <h4 class="card-title">Total</h4>
              <p class="card-text">{{ totalVal }}</p>
            </div>
          </div>
        </ul>
      </div>
    </form>
  </section>
</div>
