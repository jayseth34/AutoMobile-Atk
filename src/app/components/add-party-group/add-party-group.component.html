<form class="addPartyGroup" [formGroup]="addPartyGroup">
    <h2>Add Party Group</h2>
    <div class="form-group">
      <label for="partyGroupName">ENTER PARTY GROUP NAME</label>
      <input type="text" class="form-control" id="partyGroupName" formControlName="partyGroupName" [(ngModel)]="partyGroupName">
    </div>

    <hr>
    <button type="submit" class="btn btn-primary">SAVE</button>

  </form>
