<div class="login-container">
  <form class="login-form centerAlignment" [formGroup]="loginForm">
    <h2>LOGIN</h2>
    <div class="form-group">
      <input
        type="text"
        id="mobileno"
        name="mobileno"
        placeholder="Enter Mobile no."
        formControlName="phonenumber"
      />
    </div>

    <input class="centerAlignment" *ngIf="!showOtpInput" type="submit" value="GET OTP" (click)="GetOtp()"/>
    <!-- <h4 class="resendOtp">Resend OTP</h4> -->

    <div class="form-group centerAlignment">
      <input *ngIf="!showOtpInput" type="text" id="otp" name="otp" placeholder="Enter OTP" formControlName="otp"/>
    </div>

    <div class="form-group centerAlignment">
      <input *ngIf="showOtpInput"
        type="password"
        id="password"
        name="password"
        placeholder="Enter password"
        formControlName="password"
      />
    </div>

    <input
    class="centerAlignment"
      type="submit"
      (click)="showOtpInput ?handleLoginFormSubmit() : handleOtpFormSubmit()"
      [value]="showOtpInput ? 'SUBMIT' : 'VERIFY OTP'"
    />

    <p *ngIf="!showOtpInput" (click)="setflagvalue('password')" class="show"> Login using Password </p>
    <p *ngIf="showOtpInput" (click)="setflagvalue('otp')" class="show"> Login using OTP </p>
    <!-- <input type="submit" routerLink="/businessinfo" value="SUBMIT" /> -->
  </form>
</div>
