<div class="sidebar scrollable-div">
  <ul class="menu">
    <li class="tabs" *ngFor="let tab of tabs" 
        [ngClass]="{ 'has-sub-menu': tab.subTabs, 'selected': tab === selectedTab }">
      <a [routerLink]="tab.link" (click)="tab.action ? tab.action() : null" (click)="toggleSubMenu(tab)">
        <div class="tab-content">
          <!-- Apply the class dynamically -->
          <img [src]="tab.icon" [alt]="tab.name + ' Icon'" class="icon icon-white" />
          {{ tab.name }}
          <span *ngIf="tab.subTabs" class="dropdown-icon">
            <img style="width: 25px; height: 25px;"
              [src]="'https://icons.veryicon.com/png/o/miscellaneous/decon/dropdown-1.png'"
              [ngClass]="{ 'rotated': tab.isOpen }" alt="Dropdown Icon" />
          </span>
        </div>
      </a>
      <ul class="sub-menu" *ngIf="tab.subTabs && tab.isOpen">
        <li class="sub-tabs" *ngFor="let subTab of tab.subTabs"
        [ngClass]="{ 'selected': subTab === selectedTab }">
          <a [routerLink]="subTab.link" (click)="selectSubTab(subTab)">{{ subTab.name }}</a>
        </li>
      </ul>
    </li>
  </ul>
</div>
