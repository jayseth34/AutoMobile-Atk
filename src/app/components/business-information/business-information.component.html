<app-sidebar></app-sidebar>
<div class="container">
    <form >
  
      <label for="businessName">Business Name</label>
      <input type="text" id="businessName" name="businessName" placeholder="Enter Business Name" required>

      <label for="businessDesc">Business Description</label>
      <input type="text" id="businessDesc" name="businessDesc" placeholder="Enter Business Description">

      <label for="phoneNo">Phone no.</label>
      <input type="text" id="phoneNo" name="phoneNo" placeholder="Enter Phone number">

      <label for="email">Email</label>
      <input type="text" id="email" name="email" placeholder="Enter Email Id">

      <label for="businessAddress">Business Address</label>
      <textarea name="businessAddress" id="businessAddress" cols="30" rows="10" placeholder="Enter Business Address"></textarea>

      <label for="businessCategory">Business Category</label>
      <input type="text" id="businessCategory" name="businessCategory" placeholder="Enter Business Category">

      <label for="businessType">Business Type</label>
      <select id="businessType" name="businessType">
        <option value="b1">b1</option>
        <option value="b2">b2</option>
        <option value="b3">b3</option>
      </select>

      <label for="gstin">GSTIN</label>
      <input type="text" id="gstin" name="gstin" placeholder="Enter GSTIN">

      <label for="state">State</label>
      <select id="state" name="state">
        <option value="state1">state1</option>
        <option value="state2">state2</option>
        <option value="state3">state3</option>
      </select>
  
      <label for="sign">Signature</label>

      <br>
  
      <input type="submit" value="SAVE">
  
    </form>
  </div>
