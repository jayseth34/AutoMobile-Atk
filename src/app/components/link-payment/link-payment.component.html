<div class="payment-link-page">
  <div class="popup-container app-form-shell">
    <div class="app-form-header">
      <h2 class="app-form-title">Link Payment</h2>
      <div class="lp-meta text-muted">
        {{ customername }}
      </div>
    </div>

    <div class="app-form-divider"></div>

    <div class="input-row">
      <div class="input-group">
        <mat-form-field appearance="fill">
          <mat-label>Party</mat-label>
          <input matInput id="party" [value]="customername" readonly />
        </mat-form-field>
      </div>
      <div class="input-group">
        <mat-form-field appearance="fill">
          <mat-label>Received</mat-label>
          <input matInput id="received" [value]="received" readonly />
        </mat-form-field>
      </div>
    </div>
    <!-- <div class="filters">
      <mat-form-field appearance="fill">
        <mat-label>Filter Transactions</mat-label>
        <mat-select>
          <mat-option value="all">All transactions</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Search</mat-label>
        <input matInput placeholder="Search">
      </mat-form-field>
    </div> 
-->
    <div class="table-container">
      <table mat-table [dataSource]="transactions" class="mat-elevation-z8 lp-table">
        <ng-container matColumnDef="disable">
          <th mat-header-cell *matHeaderCellDef>Disable</th>
          <td mat-cell *matCellDef="let transaction">
            <mat-checkbox [(ngModel)]="transaction.disabled" (change)="updateLinkedAmount(transaction)"></mat-checkbox>
          </td>
        </ng-container>
  
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let transaction">{{ transaction.invoicedate }}</td>
        </ng-container>
  
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let transaction">{{ transaction.typeofpay }}</td>
        </ng-container>
  
        <ng-container matColumnDef="refInvNo">
          <th mat-header-cell *matHeaderCellDef>Ref/Inv No.</th>
          <td mat-cell *matCellDef="let transaction">{{ transaction.invoicenumber }}</td>
        </ng-container>
  
        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>Total</th>
          <td mat-cell *matCellDef="let transaction">{{ transaction.total }}</td>
        </ng-container>
  
        <ng-container matColumnDef="balance">
          <th mat-header-cell *matHeaderCellDef>Balance</th>
          <td mat-cell *matCellDef="let transaction">{{ transaction.balance }}</td>
        </ng-container>
  
        <ng-container matColumnDef="linkedAmount">
          <th mat-header-cell *matHeaderCellDef>Linked Amount</th>
          <td mat-cell *matCellDef="let transaction">
            <input matInput class="lp-linked-input" type="text" [value]="transaction.linkedAmount" [disabled]="transaction.disabled" />
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="['disable', 'date', 'type', 'refInvNo', 'total', 'balance', 'linkedAmount']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['disable', 'date', 'type', 'refInvNo', 'total', 'balance', 'linkedAmount'];"></tr>
      </table>
    </div>

    <div class="footer">
      <div class="unused-pill">Unused: {{ totalUnused }}</div>
      <div class="actions">
        <button type="button" class="btn reset-button" (click)="reset()">Reset</button>
        <button type="button" class="btn autolink-button" (click)="autoLinkTransactions()">Auto-Link</button>
        <button type="button" class="btn done-button" (click)="saveChanges()">Done</button>
      </div>
    </div>
  </div>
</div>
