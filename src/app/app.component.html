<div class="container-fluid root-container">
  <button
    *ngIf="!dataService.isLogin && isMobileView"
    type="button"
    class="mobile-sidebar-toggle btn"
    (click)="toggleMobileSidebar()"
  >
    ☰ Menu
  </button>

  <!-- Conditionally Show Sidebar -->
  <div *ngIf="!dataService.isLogin" class="sidebar-col p-0" [ngClass]="{ 'mobile-open': isMobileSidebarOpen }">
    <app-sidebar (itemSelected)="closeMobileSidebar()"></app-sidebar>
  </div>

  <!-- Adjust Main Content Width Based on Sidebar Visibility -->
  <div class="content-col" [ngClass]="{'with-sidebar': !dataService.isLogin, 'full-width': dataService.isLogin}">
    <router-outlet></router-outlet>
  </div>
</div>
